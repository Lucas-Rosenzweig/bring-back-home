[project]
name = "bring-back-home"
version = "0.1.0"
description = "Nintendo Switch LDN client for local Pokémon trades"
requires-python = ">=3.13"
dependencies = [
    "pycryptodome>=3.23,<4",
    "python-netlink>=0.0.15,<0.1",
    "trio>=0.30,<1",
    "zstandard>=0.24,<1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.407,<2",
]

[tool.uv]
package = false
